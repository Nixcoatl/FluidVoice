name: Compilar mi FluidVoice

# Compila la app en una Mac de GitHub, la firma con el certificado personal y la
# publica como Release del fork; la app instalada detecta esas Releases y se
# actualiza sola. Se ejecuta con cada push a main, a mano, o al sincronizar.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: mi-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Set personal version
      run: |
        set -euo pipefail
        # "1.6.10-beta.7" -> "1.6.10-nix.<run>": always increasing, so the in-app updater sees each build.
        CORE="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Info.plist | sed 's/-.*//')"
        APP_VERSION="$CORE-nix.${{ github.run_number }}"
        /usr/libexec/PlistBuddy -c "Set CFBundleShortVersionString $APP_VERSION" Info.plist
        echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
        echo "Version: $APP_VERSION"

    - name: Build (Release, sin firma de Apple)
      run: |
        set -o pipefail
        xcodebuild build \
          -project Fluid.xcodeproj \
          -scheme Fluid \
          -configuration Release \
          -destination 'generic/platform=macOS' \
          -derivedDataPath DerivedData \
          ARCHS=arm64 \
          CODE_SIGN_IDENTITY="-" \
          CODE_SIGN_STYLE=Manual \
          DEVELOPMENT_TEAM="" \
          > build.log 2>&1 || {
            echo "::group::Compiler errors"
            grep -E "error:" build.log | sort -u | head -80
            echo "::endgroup::"
            tail -n 40 build.log
            exit 1
          }
        tail -n 20 build.log

    - name: Import personal signing certificate
      env:
        CERT_P12: ${{ secrets.FLUIDVOICE_CERT_P12 }}
        CERT_PASSWORD: ${{ secrets.FLUIDVOICE_CERT_PASSWORD }}
      run: |
        set -euo pipefail
        if [ -z "${CERT_P12:-}" ]; then
          echo "No personal certificate secret; falling back to ad-hoc signing."
          echo "SIGN_IDENTITY=-" >> "$GITHUB_ENV"
          exit 0
        fi
        KC="$RUNNER_TEMP/signing.keychain-db"
        KC_PW="$(uuidgen)"
        echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
        security create-keychain -p "$KC_PW" "$KC"
        security set-keychain-settings -lut 21600 "$KC"
        security unlock-keychain -p "$KC_PW" "$KC"
        security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign
        security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PW" "$KC" > /dev/null
        security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
        rm -f "$RUNNER_TEMP/cert.p12"
        # Self-signed, so it shows as untrusted; codesign still uses it by hash.
        HASH="$(security find-identity -p codesigning "$KC" | awk '/"FluidVoice Nixcoatl Personal"/ {print $2; exit}')"
        [ -n "$HASH" ] || { echo "Signing identity not found"; exit 1; }
        echo "SIGN_IDENTITY=$HASH" >> "$GITHUB_ENV"
        echo "SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"

    - name: Normalize CTranscribe.framework and sign
      run: |
        set -euo pipefail
        APP="DerivedData/Build/Products/Release/FluidVoice.app"
        FW="$APP/Contents/Frameworks/CTranscribe.framework"
        SIGN=(codesign --force --sign "$SIGN_IDENTITY" --options runtime --timestamp=none)
        if [ -n "${SIGN_KEYCHAIN:-}" ]; then SIGN+=(--keychain "$SIGN_KEYCHAIN"); fi
        if [ -d "$FW/Versions/A" ]; then
          for p in "$FW/Versions/Current" "$FW/CTranscribe" "$FW/Resources"; do
            rm -rf "$p"
          done
          ln -s A "$FW/Versions/Current"
          ln -s Versions/Current/CTranscribe "$FW/CTranscribe"
          ln -s Versions/Current/Resources "$FW/Resources"
          "${SIGN[@]}" "$FW"
        fi
        # Re-sign with the entitlements Xcode generated (Fluid.entitlements plus the
        # ENABLE_RESOURCE_ACCESS_* ones such as audio-input), not the raw source file.
        ENT="$RUNNER_TEMP/entitlements.plist"
        codesign -d --entitlements - --xml "$APP" > "$ENT"
        plutil -p "$ENT" | grep -q 'com.apple.security.device.audio-input' \
          || { echo "audio-input entitlement missing"; exit 1; }
        "${SIGN[@]}" --entitlements "$ENT" "$APP"
        codesign -d --entitlements - --xml "$APP" | plutil -p - | grep -q 'com.apple.security.device.audio-input' \
          || { echo "audio-input entitlement lost after re-sign"; exit 1; }
        codesign --verify --deep --strict --verbose=2 "$APP"
        codesign -d -r- "$APP"

    - name: Zip app
      run: |
        cd DerivedData/Build/Products/Release
        ditto -c -k --keepParent FluidVoice.app "$GITHUB_WORKSPACE/FluidVoice.zip"

    - name: Upload app
      uses: actions/upload-artifact@v4
      with:
        name: FluidVoice-${{ github.sha }}
        path: FluidVoice.zip
        retention-days: 30

    - name: Publish release for in-app updates
      if: github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        ASSET="fluidvoice-$APP_VERSION.zip"
        cp FluidVoice.zip "$ASSET"
        NOTES="$(git log -1 --format='%s%n%n%b' "$GITHUB_SHA")"
        gh release create "v$APP_VERSION" "$ASSET" \
          --repo "$GITHUB_REPOSITORY" \
          --target "$GITHUB_SHA" \
          --title "FluidVoice $APP_VERSION (Nixcoatl)" \
          --notes "$NOTES"
        # Keep only the 10 most recent releases.
        gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[10:][].tagName' \
          | while read -r tag; do gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag; done
